  - record_key: ADMIN-REQ-0007
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide revenue chart data filtered by date range
      (start and end dates in mm/dd/yyyy format) and optional category.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.getChartInfo() accepts Start and End date elements
      and optional ReqCategory element. Date parsing uses SimpleDateFormat
      with mm/dd/yyyy pattern. Returns revenue as float values per category.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getChartInfo() parses Start, End, and ReqCategory
      from XML request. getProperDate() method converts mm/dd/yyyy strings to
      Date objects using StringTokenizer. Method returns revenue chart data
      with totalAmount aggregation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 239
        line_end: 256
        excerpt: |
          String getChartInfo(Element root, String request) {
            try {
              Map chartInfo = null;
              String category = null;
              String start = getValue(root.getElementsByTagName("Start").item(0));
              String end = getValue(root.getElementsByTagName("End").item(0));
              AdminRequestBD bd = new AdminRequestBD();
              category =
                getValue(root.getElementsByTagName("ReqCategory").item(0));
              chartInfo = bd.getChartInfo(request,
                                          getProperDate(start),
                                          getProperDate(end),
                                          category);
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 319
        line_end: 326
        excerpt: |
          Date getProperDate(String inpDate) {
            StringTokenizer tokens = new StringTokenizer(inpDate, "/");
            Integer month = new Integer((String)tokens.nextElement());
            Integer day = new Integer((String)tokens.nextElement());
            Integer year = new Integer((String)tokens.nextElement());
            return(new Date(year.intValue()-1900, month.intValue()-1,
                            day.intValue()));
          }

