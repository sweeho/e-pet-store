  - record_key: ADMIN-REQ-0006
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL allow administrators to update order status to one of:
      PENDING, APPROVED, or DENIED, and persist changes via asynchronous message.
    confidence: high
    confidence_basis: >
      updateOrders method in AdminRequestBD uses AsyncSender to send order
      changes. OrdersApprovePanel UI allows selection of three status values
      and commit operation. Server-side handles UPDATESTATUS request type.
    risk_class: operational
    basis: >
      AdminRequestBD.updateOrders() sends OrderApproval XML to AsyncSender EJB.
      OrdersApprovePanel allows user to select status from PENDING, APPROVED,
      or DENIED and commit changes. ApplRequestProcessor.updateOrders()
      processes UPDATESTATUS request type and creates ChangedOrder objects.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 115
        line_end: 130
        excerpt: |
          public void updateOrders(OrderApproval oa) throws AdminBDException {
            try {
              AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
              AsyncSender sender= home.create();
              sender.sendAMessage(oa.toXML());
            } catch (ServiceLocatorException sle) {
              sle.printStackTrace();
              throw new AdminBDException(sle.getMessage());
            } catch (XMLDocumentException xde) {
              xde.printStackTrace();
              throw new AdminBDException(xde.getMessage());
            }  catch (CreateException ce) {
              throw new AdminBDException(ce.getMessage());
            }
          }
