  - record_key: ADMIN-REQ-0009
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The administrator SHALL be able to launch the rich client via Java Web Start
      by requesting the JNLP file from AdminRequestProcessor with currentScreen=manageorders.
    confidence: high
    confidence_basis: >
      AdminRequestProcessor.buildJNLP() constructs JNLP file dynamically with
      application details. doPost() method checks for currentScreen parameter
      and serves JNLP with application/x-java-jnlp-file content type when
      currentScreen equals "manageorders".
    risk_class: presentational
    basis: >
      AdminRequestProcessor.buildJNLP() method constructs XML JNLP file with
      J2SE resources and main application class. doPost() checks
      req.getParameter("currentScreen") and generates JNLP output when
      curScreen equals "manageorders".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 102
        line_end: 119
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
          throws IOException, ServletException {
            String curScreen = req.getParameter("currentScreen");
            if (curScreen == null) {
              return;
            }
            curScreen = curScreen.trim();
            if(curScreen.equals("logout")) {
              getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
            }
            if(curScreen.equals("manageorders")) {
              resp.setContentType("application/x-java-jnlp-file");
              ServletOutputStream out = resp.getOutputStream();
              out.println(buildJNLP(req));
              out.flush();
              out.close();
            }
          }

