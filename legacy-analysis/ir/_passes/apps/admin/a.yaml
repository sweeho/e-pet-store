  - record_key: ADMIN-REQ-0004
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide the ability to list and display orders
      filtered by status (PENDING, APPROVED, DENIED, or COMPLETED).
    confidence: high
    confidence_basis: >
      Multiple sources confirm this capability: getOrdersByStatus() method
      in AdminRequestBD, DataSource loads all four status types, and
      ApplRequestProcessor implements GETORDERS XML request type.
    risk_class: operational
    basis: >
      AdminRequestBD.getOrdersByStatus() delegates to OPCAdminFacadeRemote EJB.
      DataSource.getServerOrderData() retrieves orders for all four status values.
      ApplRequestProcessor.processRequest() handles GETORDERS request type
      and builds XML response with order details.
