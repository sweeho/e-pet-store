  - record_key: ADMIN-REQ-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL restrict access to administrative operations to users
      authenticated with the "administrator" role.
    confidence: high
    confidence_basis: >
      Web.xml declares security-constraint for /AdminRequestProcessor with
      auth-constraint role-name="administrator". Both web tier (AdminRequestProcessor)
      and application tier (ApplRequestProcessor) enforce session validation.
    risk_class: operational
    basis: >
      web.xml security-constraint requires administrator role for AdminRequestProcessor.
      ApplRequestProcessor checks session existence and rejects null sessions with
      "Session Timed Out" error.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 88
        line_end: 99
        excerpt: |
          HttpSession session = req.getSession(false);
          ServletOutputStream out = resp.getOutputStream();
          if(session == null) {
            out.println(replyHeader +
                        "<Error>Session Timed Out; Please exit and " +
                        "login as admin from the login page</Error>\n" +
                        "</Response>\n");

