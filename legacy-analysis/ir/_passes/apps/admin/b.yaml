  - record_key: ADM-REQUIREMENT-0004
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL support retrieval of orders filtered by status using the
      XML request type "GETORDERS". The request SHALL include a Status element,
      and the response SHALL return a collection of order details including
      OrderId, UserId, OrderDate, OrderAmount, and OrderStatus for all matching orders.
    confidence: high
    confidence_basis: >
      The GETORDERS functionality is clearly defined in ApplRequestProcessor.java
      with explicit parsing of the Status XML element and calling of
      AdminRequestBD.getOrdersByStatus(). The response format is constructed
      explicitly in the code with all required fields.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getOrders() method parses the Status element from the
      XML request and calls bd.getOrdersByStatus(status). The response is
      constructed with OrderId, UserId, OrderDate, OrderAmount, OrderStatus
      for each order in the returned collection.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 166
        line_end: 203
        excerpt: |
          String getOrders(Element root) {
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  NodeList nl = root.getElementsByTagName("Status");
                  String status = getValue(nl.item(0));
                  OrdersTO orders = bd.getOrdersByStatus(status);
                  if (orders == null) {
                      return null;
                  }

                  StringBuffer responseBuffer = new StringBuffer(replyHeader);
                  responseBuffer.append("<Type>GETORDERS</Type>\n");
                  responseBuffer.append("<Status>" + status + "</Status>\n");
                  responseBuffer.append("<TotalCount>" + orders.size() +
                                        "</TotalCount>\n" );
                  for (Iterator it = orders.iterator(); it.hasNext(); ) {
                      OrderDetails o = (OrderDetails) it.next();
                      responseBuffer.append("<Order>\n");
                      responseBuffer.append("<OrderId>" + o.getOrderId()
                                            + "</OrderId>\n");
                      responseBuffer.append("<UserId>" + o.getUserId()
                                            + "</UserId>\n");
                      responseBuffer.append("<OrderDate>" + o.getOrderDate()
                                            + "</OrderDate>\n");
                      responseBuffer.append("<OrderAmount>" + o.getOrderValue()
                                            + "</OrderAmount>\n");
                      responseBuffer.append("<OrderStatus>" + o.getOrderStatus()
                                            + "</OrderStatus>\n");
                      responseBuffer.append("</Order>\n");
                  }

  - record_key: ADM-REQUIREMENT-0005
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL support updating order statuses using the XML request type
      "UPDATESTATUS". The request SHALL include a collection of Order elements,
      each with an OrderId and OrderStatus. The system SHALL validate that both
      OrderId and OrderStatus are present before processing the update.
    confidence: high
    confidence_basis: >
      The UPDATESTATUS logic is explicitly coded in ApplRequestProcessor.updateOrders()
      with clear validation of both OrderId and OrderStatus elements before
      creating ChangedOrder objects. This is a deterministic requirement enforced
      by the code.
    risk_class: operational
    basis: >
      ApplRequestProcessor.updateOrders() method iterates through Order elements
      from the XML request and checks that both OrderId and OrderStatus are not
      null before processing: if (orderId != null && orderStatus != null).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 224
        excerpt: |
          String updateOrders(Element root) {

              // a better solution would be using a style sheet to convert from
              // one schema to the other

              OrderApproval oa = new OrderApproval();

              NodeList nl = root.getElementsByTagName("Order");
              for (int i = 0; i < nl.getLength(); i++) {
                  Element e = (Element) nl.item(i);

                  // Assumes values of OrderStatus are the same for both schemas
                  String orderId =
                      getValue((Element) e.getElementsByTagName("OrderId").item(0));
                  String orderStatus =
                      getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
                  if (orderId != null && orderStatus != null) {
                      oa.addOrder(new ChangedOrder(orderId, orderStatus));
                  }
              }

  - record_key: ADM-REQUIREMENT-0006
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL send order approval changes asynchronously via the
      AsyncSender EJB. After validating and assembling order status changes,
      the system SHALL serialize the OrderApproval object to XML and send it
      to the AsyncSender for asynchronous processing.
    confidence: high
    confidence_basis: >
      The AsyncSender integration is explicit in AdminRequestBD.updateOrders(),
      with clear JNDI lookup and message sending. The ejb-ref and ejb-local-ref
      are declaratively defined in web.xml, and the JNDI lookup code is
      straightforward and reachable.
    risk_class: operational
    basis: >
      AdminRequestBD.updateOrders() explicitly looks up the AsyncSender EJB
      from JNDI and calls sender.sendAMessage(oa.toXML()). The AsyncSenderLocalHome
      and AsyncSender EJB reference is defined in web.xml as ejb-local-ref.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 115
        line_end: 130
        excerpt: |
          public void updateOrders(OrderApproval oa) throws AdminBDException {
              try {
                  AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                      ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
                  AsyncSender sender= home.create();
                  sender.sendAMessage(oa.toXML());
              } catch (ServiceLocatorException sle) {
                  sle.printStackTrace();
                  throw new AdminBDException(sle.getMessage());
              } catch (XMLDocumentException xde) {
                  xde.printStackTrace();
                  throw new AdminBDException(xde.getMessage());
              }  catch (CreateException ce) {
                  throw new AdminBDException(ce.getMessage());
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 110
        line_end: 116
        excerpt: |
