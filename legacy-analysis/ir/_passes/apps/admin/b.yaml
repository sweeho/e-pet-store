      web.xml. The method calls are straightforward and error handling is present.
    risk_class: operational
    basis: >
      AdminRequestBD constructor uses ServiceLocator to look up OPCAdminFacadeHome
      from JNDI path "java:comp/env/ejb/OPCAdminFacadeRemote" and creates a remote
      EJB instance. getOrdersByStatus() and getChartInfo() delegate to
      opcAdminEJB methods. web.xml declares the ejb-ref with home and remote interfaces.
