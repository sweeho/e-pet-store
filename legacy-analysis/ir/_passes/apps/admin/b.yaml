  - record_key: ADM-REQUIREMENT-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL enforce role-based access control such that only users
      with the "administrator" role may access the AdminRequestProcessor servlet.
      Access to GET and POST methods on /AdminRequestProcessor SHALL be restricted
      to the administrator role.
    confidence: high
    confidence_basis: >
      The security constraint in web.xml explicitly defines role-based access
      control for the AdminRequestProcessor endpoint. Both documentation (web.xml)
      and code enforcement are present in a single declarative source.
    risk_class: operational
    basis: >
      web.xml security-constraint element specifies that only users with
      administrator role can access /AdminRequestProcessor via GET or POST methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>

