  - record_key: ADM-REQUIREMENT-0010
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support reporting on sales (REVENUE) and orders (ORDERS)
      via XML requests. The request SHALL include Start date, End date, and
      optional ReqCategory. Dates SHALL be in MM/dd/yyyy format. The response
      SHALL return chart data with items and their values, plus TotalSales.
    confidence: medium
    confidence_basis: >
      The REVENUE and ORDERS functionality is implemented in getChartInfo() method
      with explicit parsing of Start, End, and ReqCategory elements. However, the
      exact date format requirement (MM/dd/yyyy) is only evident from the
      getProperDate() parsing logic which uses StringTokenizer with "/" delimiter
      and assumes order of month, day, year. This is a single source of truth.
    risk_class: financial
    basis: >
      ApplRequestProcessor.getChartInfo() parses Start, End, and ReqCategory
      elements from XML request. The getProperDate() method tokenizes the date
      string by "/" and treats tokens as month, day, year integers. Response
      construction iterates through chart data map and appends total values.
