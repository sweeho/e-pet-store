  - record_key: ADM-REQUIREMENT-0012
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The system SHALL accept XML request documents from the rich client and
      parse them using a DOM (Document Object Model) parser. The request SHALL
      be read from the HTTP request body and parsed to extract the request type.
    confidence: high
    confidence_basis: >
      The XML parsing logic is explicitly implemented in ApplRequestProcessor.processRequest()
      using DocumentBuilderFactory and SAX InputSource. The parsing is deterministic
      and handles specific SAX and parser exceptions.
    risk_class: operational
    basis: >
      ApplRequestProcessor.doPost() reads the request body via BufferedReader
      and passes the string to processRequest(). The processRequest() method
      creates a DocumentBuilder from DocumentBuilderFactory and parses the
      XML to extract the Type element.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 85
        line_end: 115
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws java.io.IOException, javax.servlet.ServletException {

              HttpSession session = req.getSession(false);
              ServletOutputStream out = resp.getOutputStream();

              if(session == null) {
                  out.println(replyHeader +
                              "<Error>Session Timed Out; Please exit and " +
                              "login as admin from the login page</Error>\n" +
                              "</Response>\n");
              } else {
                  String sId = session.getId();
                  resp.setContentType("text/xml");
                  BufferedReader inp = req.getReader();
                  StringBuffer strbuf = new StringBuffer("");
                  while(true) {
                      String str = inp.readLine();
                      if(str == null)
                          break;
                      strbuf.append(str+"\n");
                  }
                  inp.close();
                  out.println(processRequest(strbuf.toString()));
              }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 122
        line_end: 147
        excerpt: |
          String processRequest(String xmlString) {
              try {
                  InputSource source =
                      new InputSource(new ByteArrayInputStream(xmlString.
                                                               getBytes()));
                  DocumentBuilder db =
                      DocumentBuilderFactory.newInstance().newDocumentBuilder();
                  Element root =
                      db.parse(source).getDocumentElement();
                  String reqType = getValue(root.getElementsByTagName("Type")
                                            .item(0));
                  if (reqType.equals("GETORDERS")) {
                      return getOrders(root);
                  }
                  else if (reqType.equals("UPDATESTATUS")) {
                      return updateOrders(root);
                  }
                  else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                      return getChartInfo(root, reqType);
                  }
                  else {
                      return replyHeader +
                          "<Error>Unable to process request : " +
                          "Unknown request type - " + reqType +
                          "</Error>\n</Response>\n";
                  }
              }

  - record_key: ADM-REQUIREMENT-0013
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL support a three-step order approval workflow: (1) retrieve
      pending orders via GETORDERS request with Status="PENDING", (2) present
      orders to administrator who may mark each as APPROVED or DENIED, (3) commit
      changes via UPDATESTATUS request which sends the order approval changes
      asynchronously to the AsyncSender EJB.
    confidence: medium
    confidence_basis: >
      The workflow steps are evidenced by: (1) GETORDERS handler in ApplRequestProcessor,
      (2) client panel OrdersApprovePanel with Approve/Deny/Commit buttons in the
      properties file, (3) UPDATESTATUS handler calling AsyncSender. However, the
      complete workflow orchestration is distributed across client code (which is
      Swing desktop) and server code, so the complete flow is not visible in server
      code alone.
    risk_class: operational
    basis: >
      ApplRequestProcessor handles GETORDERS and UPDATESTATUS request types.
      Properties file defines OrdersApprovePanel with ApproveButton, DenyButton,
      CommitButton labels. AdminRequestBD.updateOrders() sends OrderApproval to
      AsyncSender. The workflow is orchestrated by the Swing client, not the server.
