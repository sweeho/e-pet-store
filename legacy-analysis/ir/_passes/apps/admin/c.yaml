  - record_key: ADMIN-OPS-REQ-0004
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL build and serve a dynamic JNLP (Java Network Launch Protocol)
      file to enable Java Web Start deployment of a rich client admin interface.
    confidence: high
    confidence_basis: >
      Both the declarative configuration (servlet-mapping in web.xml) and the
      programmatic implementation (buildJNLP method in AdminRequestProcessor) provide
      independent evidence. The method is called in the doPost handler.
    risk_class: operational
    basis: >
      The AdminRequestProcessor servlet implements buildJNLP method that constructs a
      JNLP XML document with codebase, resources, and application descriptor elements.
      The servlet is mapped to /AdminRequestProcessor in web.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 95
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
              jnlp.append("<jnlp codebase=\"http://").append(serverName).append(":").append(serverPort).append("/admin\">\n");
              // ... appInfo, resources, application-desc ...
              return(jnlp.toString());
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 102
        line_end: 119
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws IOException, ServletException {
              String curScreen = req.getParameter("currentScreen");
              if(curScreen.equals("manageorders")) {
                  resp.setContentType("application/x-java-jnlp-file");
                  ServletOutputStream out = resp.getOutputStream();
                  out.println(buildJNLP(req));
                  out.flush();
                  out.close();
              }
          }
    stack_metadata:
      framework: servlet
      struts.action: AdminRequestProcessor

