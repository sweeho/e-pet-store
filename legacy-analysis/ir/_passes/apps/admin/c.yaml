  - record_key: ADMIN-OPS-REQ-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL restrict access to the AdminRequestProcessor servlet to users
      with the "administrator" role for GET and POST methods.
    confidence: high
    confidence_basis: >
      Declarative security constraint in web.xml clearly defines role-based access
      control. This is enforced by the container at the declarative level.
    risk_class: operational
    basis: >
      Security constraint in web.xml specifies role-name "administrator" for
      /AdminRequestProcessor URL pattern with GET and POST methods.
    traces:
