  - record_key: ADMIN-OPS-INTEGRATION-0003
    kind: integration
    capability_key: admin-operations
    requirement: >
      The system SHALL process XML-based requests from the rich client containing order
      status changes or analytics queries and return responses in XML format.
    confidence: high
    confidence_basis: >
      The ApplRequestProcessor servlet implements a complete XML request/response
      protocol with specific request types (GETORDERS, UPDATESTATUS, REVENUE, ORDERS)
      and corresponding response generation methods.
    risk_class: operational
    basis: >
      ApplRequestProcessor.doPost reads the request body as XML, parses it using DOM,
      extracts the Type element, and routes to appropriate handler methods that return
      XML responses with replyHeader and structured elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 85
        line_end: 115
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws java.io.IOException, javax.servlet.ServletException {

              HttpSession session = req.getSession(false);
              ServletOutputStream out = resp.getOutputStream();

              if(session == null) {
                  out.println(replyHeader +
                              "<Error>Session Timed Out; Please exit and " +
                              "login as admin from the login page</Error>\n" +
                              "</Response>\n");
              } else {
                  String sId = session.getId();
                  resp.setContentType("text/xml");
                  BufferedReader inp = req.getReader();
                  StringBuffer strbuf = new StringBuffer("");
                  while(true) {
                      String str = inp.readLine();
                      if(str == null)
                          break;
                      strbuf.append(str+"\n");
                  }
                  inp.close();
                  out.println(processRequest(strbuf.toString()));
              }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 122
        line_end: 164
        excerpt: |
          String processRequest(String xmlString) {
              try {
                  InputSource source = new InputSource(new ByteArrayInputStream(xmlString.getBytes()));
                  DocumentBuilder db = DocumentBuilderFactory.newInstance().newDocumentBuilder();
                  Element root = db.parse(source).getDocumentElement();
                  String reqType = getValue(root.getElementsByTagName("Type").item(0));
                  if (reqType.equals("GETORDERS")) {
                      return getOrders(root);
                  }
                  else if (reqType.equals("UPDATESTATUS")) {
                      return updateOrders(root);
                  }
                  else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                      return getChartInfo(root, reqType);
                  }
    stack_metadata:
      framework: servlet

  - record_key: ADMIN-OPS-REQUIREMENT-0006
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL require a valid HTTP session for all XML-based admin requests;
      if the session has timed out, the system SHALL return an XML error message
      indicating "Session Timed Out".
    confidence: high
    confidence_basis: >
      The session validation is enforced at the servlet level in ApplRequestProcessor
      with explicit null-check followed by error response generation. This is
      implemented programmatically and is the only entry point for XML requests.
    risk_class: operational
    basis: >
      ApplRequestProcessor.doPost calls req.getSession(false) and checks if the result
      is null. If null, it writes an error response before attempting to process the
      request.
    traces:
