  - record_key: ADMIN-QUERY-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide an admin interface to query orders by status. WHEN
      OPCAdminFacadeEJB.getOrdersByStatus(status) is called THEN it returns a collection
      of OrderDetails objects containing order ID, user ID, order date (formatted as MM/DD/YYYY),
      order value, and status for all orders matching the given status.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB.java lines 131-149 show the complete implementation of
      getOrdersByStatus method with explicit transformation of order data into OrderDetails
      objects. The method signature and return type are declared in ejb-jar.xml lines 776-786
      as a Remote business method with Required transaction attribute.
    risk_class: operational
    basis: >
      Both declarative (ejb-jar.xml) and programmatic (OPCAdminFacadeEJB.java) sources
      document the same requirement. Date formatting logic (month+1, year+1900) is
      explicit in the code.
