records:
  - record_key: ORDER-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process purchase orders through a multi-stage workflow:
      WHEN a purchase order message is received THEN the system creates a PurchaseOrder
      entity, initializes its status, and transitions it through approval and fulfillment
      stages via the ProcessManager.
    confidence: high
    confidence_basis: >
      Both ejb-jar.xml (lines 110-198) and PurchaseOrderMDB.java (lines 71-100) explicitly
      define PurchaseOrderMDB receiving messages from Java Pet Store and creating PurchaseOrder
      EJB entities. ProcessManager integration is hardcoded in both files. The workflow is
      enforced at container level with Required transactions.
    risk_class: operational
    basis: >
      ejb-jar.xml defines PurchaseOrderMDB listening to jms/OrderApprovalQueue with
      ProcessManager EJB local reference. PurchaseOrderMDB.java shows ejbCreate() instantiates
      processManager and poHome, establishing the workflow infrastructure.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 110
        line_end: 198
        excerpt: |
          <!-- Process recieving a PO from the Java Pet Store Start-->
            <message-driven>
              <description>opc node to process PurchaseOrders from the Java Pet Store</description>
              <display-name>PurchaseOrderMDB</display-name>
              <ejb-name>PurchaseOrderMDB</ejb-name>
              <ejb-class>com.sun.j2ee.blueprints.opc.ejb.PurchaseOrderMDB</ejb-class>
              <transaction-type>Container</transaction-type>
              <message-driven-destination>
                <destination-type>javax.jms.Queue</destination-type>
              </message-driven-destination>
              <ejb-local-ref>
                <ejb-ref-name>ejb/ProcessManager</ejb-ref-name>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 71
        line_end: 100
        excerpt: |
          public class PurchaseOrderMDB implements MessageDrivenBean, MessageListener {
            private ProcessManagerLocal processManager;
            private PurchaseOrderLocalHome poHome;
            public void ejbCreate() {
              ServiceLocator serviceLocator = new ServiceLocator();
              poHome = (PurchaseOrderLocalHome)serviceLocator.getLocalHome(JNDINames.PURCHASE_ORDER_EJB);
              ProcessManagerLocalHome pmlh = (ProcessManagerLocalHome)serviceLocator.getLocalHome(JNDINames.PROCESS_MANAGER_EJB);
              processManager = pmlh.create();

  - record_key: APPROVAL-WORKFLOW-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL process order approvals from Admin through OrderApprovalMDB.
      WHEN order approval messages are received THEN the system updates purchase order
      status in the ProcessManager and routes approved orders to supplier via
      PurchaseOrderQueue, while routing approval notifications to customer relations
      via MailOrderApprovalQueue.
    confidence: high
    confidence_basis: >
      ejb-jar.xml lines 297-399 explicitly declare OrderApprovalMDB with references to
      ProcessManager, resource references to jms/OrderApprovalQueue (input), jms/PurchaseOrderQueue
      (to supplier), and jms/OrderApprovalMailQueue (to customer relations). Two independent
      message routing paths are configured at deployment time.
    risk_class: operational
    basis: >
      OrderApprovalMDB configuration shows container-managed transactions with Required
      attribute, integration with multiple queue destinations for workflow branching.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 297
        line_end: 399
        excerpt: |
          <!-- Process recieving a list of OrderApprovals from the Admin Start-->
            <message-driven>
              <description>opc node to process OrderApprovals from the Admin</description>
              <display-name>OrderApprovalMDB</display-name>
              <ejb-name>OrderApprovalMDB</ejb-name>
              <ejb-class>com.sun.j2ee.blueprints.opc.ejb.OrderApprovalMDB</ejb-class>
              <transaction-type>Container</transaction-type>
              <message-driven-destination>
                <destination-type>javax.jms.Queue</destination-type>
              </message-driven-destination>
              <resource-env-ref>
                <resource-env-ref-name>jms/OrderApprovalMailQueue</resource-env-ref-name>
              <resource-env-ref>
                <resource-env-ref-name>jms/PurchaseOrderQueue</resource-env-ref-name>

  - record_key: INVOICE-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process invoice messages from suppliers through InvoiceMDB
      listening to a JMS Topic. WHEN an invoice is received THEN the system updates
      the purchase order status and routes a completion message to MailCompletedOrderQueue
      for customer notification.
    confidence: high
    confidence_basis: >
      ejb-jar.xml lines 201-295 declare InvoiceMDB as a Topic subscriber (not a Queue
      consumer), explicitly routing to jms/CompletedOrderMailQueue. InvoiceMDB.java confirms
      integration with ProcessManager and PurchaseOrder entities. Topic-based subscription
      allows multiple consumers of same invoice event.
    risk_class: operational
    basis: >
      InvoiceMDB configuration shows container-managed transactions, Topic destination type,
      and resource references to both order and mail processing queues.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 201
        line_end: 295
        excerpt: |
          <!-- Process recieving an INVOICE from the Suppler Start-->
            <message-driven>
              <description>opc node to process Invoice from the Supplier</description>
              <display-name>InvoiceMDB</display-name>
              <ejb-name>InvoiceMDB</ejb-name>
              <ejb-class>com.sun.j2ee.blueprints.opc.ejb.InvoiceMDB</ejb-class>
              <message-driven-destination>
                <destination-type>javax.jms.Topic</destination-type>
              </message-driven-destination>
              <resource-env-ref>
                <resource-env-ref-name>jms/CompletedOrderMailQueue</resource-env-ref-name>

