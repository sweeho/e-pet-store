  - record_key: TRANSACTION-SEMANTIC-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      All message-driven bean onMessage() methods SHALL execute within a container-managed
      transaction with Required semantics. GIVEN a message arrives at the destination THEN
      the container SHALL initiate a transaction before invoking onMessage(), commit on
      successful completion, and rollback on exception.
    confidence: high
    confidence_basis: >
      ejb-jar.xml explicitly declares transaction-type as Container for all six MDBs
      (lines 116, 207, 303, 410, 500, 586) and container-transaction elements with
      trans-attribute Required for each onMessage() method (lines 708-773). This is
      a declarative requirement enforced by the EJB container itself.
    risk_class: operational
    basis: >
      EJB 2.0 deployment descriptor with explicit container-transaction declarations
      for every MDB's onMessage method. Required attribute means a transaction must
      be active for each message processing.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 708
        line_end: 773
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>PurchaseOrderMDB</ejb-name>
              <method-name>onMessage</method-name>
              <method-params>
                <method-param>javax.jms.Message</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          ... (repeated for OrderApprovalMDB, InvoiceMDB, MailInvoiceMDB, MailOrderApprovalMDB, MailCompletedOrderMDB)

  - record_key: ACCESS-CONTROL-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      All EJB methods in the OPC module SHALL be accessible without role-based
      authorization. GIVEN any caller attempts to invoke an EJB method THEN the
      container SHALL permit the invocation (unchecked security).
    confidence: high
    confidence_basis: >
      ejb-jar.xml assembly-descriptor section (lines 657-706) declares method-permission
      elements with unchecked tag for all seven EJB beans: OPCAdminFacadeEJB,
      PurchaseOrderMDB, InvoiceMDB, OrderApprovalMDB, MailInvoiceMDB, MailOrderApprovalMDB,
      MailCompletedOrderMDB. Each grants * (all methods) unchecked access.
    risk_class: operational
    basis: >
      Declarative security configuration in EJB deployment descriptor using unchecked
      elements for all enterprise beans.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 657
        line_end: 706
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
              <method>
                  <ejb-name>OPCAdminFacadeEJB</ejb-name>
                <method-name>*</method-name>
              </method>
            </method-permission>
            ... (repeated for all MDBs with unchecked permission)

