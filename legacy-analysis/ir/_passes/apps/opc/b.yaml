  - record_key: INVOICE-TOPIC-SUBSCRIPTION-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL publish invoices to a JMS Topic (not a Queue) to enable multiple
      independent subscribers. Both InvoiceMDB and MailInvoiceMDB SHALL subscribe to
      the same InvoiceTopic. InvoiceMDB updates purchase order status based on invoice
      data; MailInvoiceMDB generates customer notification emails independently using
      the same invoice event.
    confidence: high
    confidence_basis: >
      ejb-jar.xml lines 210, 412 show both InvoiceMDB and MailInvoiceMDB declared with
      message-driven-destination type javax.jms.Topic (not Queue). sun-j2ee-ri.xml lines
      137, 178 map both beans to same topic destination: InvoiceMDB to
      jms/opc/InvoiceTopic and MailInvoiceMDB also to Topic-based connection. This
      pub/sub pattern allows decoupled processing of invoice events.
    risk_class: operational
    basis: >
      Declarative Topic configuration in ejb-jar.xml and sun-j2ee-ri.xml deployment
      descriptors confirming pub/sub architecture for invoice events.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 209
        line_end: 211
        excerpt: |
          <message-driven-destination>
            <destination-type>javax.jms.Topic</destination-type>
          </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
        line_start: 136
        line_end: 137
        excerpt: |
          <ejb-name>InvoiceMDB</ejb-name>
          <jndi-name>jms/opc/InvoiceTopic</jndi-name>

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >
      The auto-approval thresholds (500 for US, 50000 for Japan) are hardcoded bare
      literals in the canIApprove() method with no configuration mechanism, external
      documentation, or test coverage visible. It is unclear whether these thresholds
      are: (1) pegged to specific currency values (USD vs JPY), (2) configurable at
      runtime via environment entries, or (3) enforced by any other business rules
      (e.g., risk management, regulatory limits). No JNDI lookup or configuration
      entry exists for these thresholds in ejb-jar.xml.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
    description: >
      Date formatting uses deprecated Java Date methods (getMonth(), getYear(),
      getDate()) with manual offset calculations. The transformation from po.getPoDate()
      (LONGINT from database) to java.util.Date constructor to string formatting is
      unclear whether po.getPoDate() returns milliseconds since epoch (expected by
      Date constructor) or some other time representation. If po.getPoDate() returns
      milliseconds, date formatting will be correct; if it returns seconds or another
      unit, the formatting will be silently wrong.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/transitions
    description: >
      Several Mail transition delegates exist (MailInvoiceTransitionDelegate,
      MailOrderApprovalTransitionDelegate, MailCompletedOrderTD) but their source code
      is not visible in read window. It is unclear what messages they send, which queues
      they target, or whether they perform additional validation/transformation.
      MailInvoiceMDB line 102 instantiates MailInvoiceTransitionDelegate but its
      doTransition() implementation is not visible.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
    description: >
      MailInvoiceMDB and MailOrderApprovalMDB both listen to their respective queues
      (jms/MailQueue) but the queue destination name is the same for both beans. It is
      unclear whether they share a single queue and use message selectors/properties to
      differentiate message types, or whether the sun-j2ee-ri.xml deployment maps these
      to separate physical queues at runtime. Reachability and routing logic cannot be
      determined from ejb-jar.xml alone.

