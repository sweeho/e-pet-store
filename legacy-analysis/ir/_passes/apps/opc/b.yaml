  - record_key: TRANSITION-DELEGATE-PATTERN-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL use pluggable TransitionDelegate pattern to implement workflow
      transitions between MDB processing stages. GIVEN a message-driven bean completes
      its work THEN it instantiates a TransitionDelegate, calls setup() to initialize
      JMS resources, and calls doTransition(TransitionInfo) to route the message to
      the next queue/topic. Each bean may use either a statically bound delegate class
      (PurchaseOrderMDB->PurchaseOrderTD, InvoiceMDB->InvoiceTD) or a factory-loaded
      delegate (OrderApprovalMDB via TransitionDelegateFactory).
    confidence: high
    confidence_basis: >
      PurchaseOrderMDB.java lines 75, 93-94 show static instantiation of PurchaseOrderTD
      and setup() call. Lines 171-175 show doTransition() invocation with TransitionInfo.
      OrderApprovalMDB.java lines 122-125 show factory pattern with TransitionDelegateFactory
      and dynamic class loading. InvoiceMDB.java lines 95-96 show static InvoiceTD
      instantiation. PurchaseOrderTD.java lines 52-87 show complete TransitionDelegate
      implementation with JMS resource management and message sending via QueueHelper.
    risk_class: operational
    basis: >
      Multiple independent implementations across different MDBs showing consistent
      TransitionDelegate usage pattern.
    stack_metadata:
      design_pattern: strategy-pattern
      pluggable_delegates: "PurchaseOrderTD, InvoiceTD, OrderApprovalTD, MailInvoiceTransitionDelegate, MailOrderApprovalTransitionDelegate, MailCompletedOrderTD"
    traces:
