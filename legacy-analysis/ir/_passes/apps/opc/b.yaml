records:
  - record_key: ORDER-AUTO-APPROVE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve purchase orders below a locale-specific
      threshold. GIVEN a purchase order is received and processed by PurchaseOrderMDB
      AND the total price is below the locale threshold THEN the order SHALL be
      automatically approved and transitioned to OrderApprovalMDB without requiring
      administrative intervention. Thresholds are: USD 500 for US locale, ¥50000
      for Japan locale.
    confidence: high
    confidence_basis: >
      PurchaseOrderMDB.java lines 183-191 show explicit logic in canIApprove() method
      comparing getTotalPrice() against hardcoded locale-specific thresholds. Method
      is called in doWork() at line 158 and controls whether automatic approval XML
      is generated. Logic is implemented in both declarative (workflow) and programmatic
      (Java) layers.
    risk_class: operational
    basis: >
      Programmatic implementation in PurchaseOrderMDB with hardcoded thresholds.
      Values are bare literals with no external configuration or comment explaining
      the business rationale.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }

