records:
  - record_key: OPC-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL implement a multi-stage order fulfillment workflow where
      purchase orders transition through states: PENDING, APPROVED or DENIED,
      SHIPPED_PART, and COMPLETED. Each order transition updates a process manager
      to track workflow state.
    confidence: high
    confidence_basis: >
      The process manager is referenced in ejb-jar.xml with explicit state names
      (OrderStatusNames) in multiple MDBs, and the workflow progression is clearly
      evident in PurchaseOrderMDB, OrderApprovalMDB, and InvoiceMDB implementations.
      The workflow is enforced at both the ProcessManager and PurchaseOrder EJB levels.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB queries orders by status. PurchaseOrderMDB creates initial
      PENDING status. OrderApprovalMDB enforces transition to APPROVED/DENIED. InvoiceMDB
      transitions to SHIPPED_PART or COMPLETED based on invoice processing.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 44
        line_end: 45
        excerpt: |
          <description>order process controller</description>
          <display-name>OrderProcessingCenterJAR</display-name>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 165
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
            if(canIApprove(purchaseOrder)) {
              ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
              OrderApproval oa = new OrderApproval();
              oa.addOrder(co);
              ret = oa.toXML();
            }
            return ret;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB, OrderApprovalMDB, InvoiceMDB (message-driven)
      db.object: PurchaseOrder, ProcessManager

  - record_key: OPC-REQUIREMENT-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve purchase orders that fall below
      locale-specific thresholds without requiring administrator intervention.
      For US locale orders, the threshold is 500. For Japan locale orders,
      the threshold is 50000.
    confidence: low
    confidence_basis: >
      The thresholds are embedded as bare numeric literals in the source code with no
      comment, configuration, or test. The hardcoded values appear only in
      PurchaseOrderMDB.canIApprove(). No authoritative source or configuration file
      specifies these thresholds or their justification.
    risk_class: financial
    basis: >
      The canIApprove method checks getTotalPrice() against hardcoded values 500
      for Locale.US and 50000 for Locale.JAPAN. Auto-approved orders bypass the
      OrderApprovalMDB admin queue entirely.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  - record_key: OPC-REQUIREMENT-0002
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL only permit status updates for orders in PENDING state.
      Orders already in APPROVED, DENIED, or COMPLETED states are immutable and
      SHALL NOT be processed again if an approval message is received.
    confidence: high
    confidence_basis: >
      The check is declarative in the OrderApprovalMDB and also enforced in the
      InvoiceMDB, both checking processManager.getStatus() and skipping processing
      if not PENDING. The pattern is consistent across both order approval and
      invoice processing paths.
    risk_class: operational
    basis: >
      OrderApprovalMDB explicitly skips any order whose current status is not PENDING
      (lines 205-206). This prevents duplicate processing of orders that have
      already been approved or denied.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 207
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }

  - record_key: OPC-REQUIREMENT-0003
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL generate supplier purchase orders (in XML format) for all
      APPROVED customer orders. Each supplier PO SHALL include shipping address,
      contact info, and all line items with category, product, and item identifiers,
      line numbers, quantities, and unit prices.
    confidence: high
    confidence_basis: >
      The getXmlPO method in OrderApprovalMDB is explicitly invoked for every
      APPROVED order, and the supplier PO XML generation is deterministic and
      traceable through the TPASupplierOrderXDE class integration.
    risk_class: operational
    basis: >
      OrderApprovalMDB.getXmlPO() builds TPASupplierOrderXDE documents for each
      approved order, populating shipping address from ContactInfo and Address EJBs,
      and line items with all required product attributes.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 218
        line_end: 268
        excerpt: |
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
          ...
          private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
            supplierOrderXDE.newDocument();
            supplierOrderXDE.setOrderId(po.getPoId());
            Date tmpDate = new Date(po.getPoDate());
            supplierOrderXDE.setOrderDate(tmpDate);
            ContactInfoLocal cinfo = po.getContactInfo();
            AddressLocal addr = cinfo.getAddress();
            supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                addr.getStreetName1(), addr.getCity(),
                                                addr.getState(), addr.getCountry(),
                                                addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());

  - record_key: OPC-REQUIREMENT-0004
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL update order status to SHIPPED_PART when a partial invoice
      is received (indicating some but not all line items have been shipped).
      When all line items for an order have been shipped (as indicated by invoices),
      the system SHALL update the status to COMPLETED.
    confidence: high
    confidence_basis: >
      InvoiceMDB.doWork() calls PurchaseOrderHelper.processInvoice() and examines
      the return value to determine whether the order is fully or partially complete.
      The state transitions are explicit in lines 167-171.
    risk_class: operational
    basis: >
      InvoiceMDB evaluates the boolean return from poHelper.processInvoice() and
      updates ProcessManager status accordingly: COMPLETED if orderDone is true,
      SHIPPED_PART otherwise. The invoice processing is deterministic and state-driven.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB

  - record_key: OPC-REQUIREMENT-0005
    kind: requirement
    capability_key: notifications
    requirement: >
      The system MAY send email notifications to customers at three distinct
      workflow points: (1) when an order approval or denial status is determined,
      (2) when shipment/invoice events occur, and (3) when an order is COMPLETED.
      Each email type is independently configurable via a boolean parameter.
    confidence: medium
    confidence_basis: >
      Three separate configuration flags exist (SendApprovalMail, SendConfirmationMail,
      SendCompletedOrderMail) in ejb-jar.xml, and each mail MDB checks its flag before
      processing. Both passes likely identified this rule. The flags are declared
      but their default values are redacted in the source.
    risk_class: presentational
    basis: >
      MailOrderApprovalMDB (line 127), MailInvoiceMDB (line 127), and
      MailCompletedOrderMDB (line 126) all check sendConfirmationMail or equivalent
      before calling doWork(). Configuration is injected at line 98, 97, and 98
      respectively from JNDINames constants.
