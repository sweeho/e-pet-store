  - record_key: OPC-REQUIREMENT-0007
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL use message-driven beans to process asynchronous workflows:
      purchase orders are received via a Queue from the Java Pet Store, invoices
      are received via a Topic subscription from suppliers, and order approvals
      are received via a Queue from the admin system. Customer notifications are
      sent to a MailQueue.
    confidence: high
    confidence_basis: >
      ejb-jar.xml declares all six MDBs with explicit message-driven-destination
      types (Queue or Topic) and resource-env-refs for each queue/topic. The routing
      is declarative and enforced at the container level.
    risk_class: operational
    basis: >
      PurchaseOrderMDB listens on a Queue (lines 117-119). InvoiceMDB listens on a
      Topic (lines 209-211). OrderApprovalMDB listens on a Queue (lines 304-306).
      Customer relation MDBs listen on Queues or Topics as declared in lines 411-412,
      501-502, and 587-588.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 111
        line_end: 196
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>PurchaseOrderMDB</display-name>
            <ejb-name>PurchaseOrderMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.PurchaseOrderMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
            ...
            <resource-env-ref>
              <resource-env-ref-name>jms/OrderApprovalQueue</resource-env-ref-name>
              <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
            </resource-env-ref>
          </message-driven>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 202
        line_end: 294
        excerpt: |
          <message-driven>
            <description>opc node to process Invoice from the Supplier</description>
            <ejb-name>InvoiceMDB</ejb-name>
