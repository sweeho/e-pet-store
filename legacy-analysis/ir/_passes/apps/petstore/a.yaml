  - record_key: USER-LOCALE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL support user locale preferences (en_US, ja_JP, zh_CN).
      GIVEN a user logs in or creates an account,
      WHEN the user has a stored preferred language preference,
      THEN the system SHALL set the application locale to that preference
      and notify the shopping cart of the locale change.
      IF the user is new (creating account for first time), the locale is set
      at account creation time.
    confidence: high
    confidence_basis: >
      SignOnEJBAction explicitly retrieves profile.getPreferredLanguage(), converts it
      using I18nUtil.getLocaleFromString(), sets it as a machine attribute, and notifies
      the shopping cart. Try/catch handles the new user case.
    risk_class: operational
    basis: >
      SignOnEJBAction.perform() calls scf.getCustomer().getProfile().getPreferredLanguage(),
      uses I18nUtil.getLocaleFromString() to convert, sets locale in machine attributes,
      and calls cart.setLocale(locale). FinderException is caught for new user scenario.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 77
        line_end: 97
        excerpt: |
          String userId = cue.getUserName();
          ShoppingClientFacadeLocal scf = null;
          scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
          scf.setUserId(userId);
          try {
              ProfileLocal profile = scf.getCustomer().getProfile();
              Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
              machine.setAttribute(PetstoreKeys.LOCALE, locale);
              ShoppingCartLocal cart = scf.getShoppingCart();
              cart.setLocale(locale);
