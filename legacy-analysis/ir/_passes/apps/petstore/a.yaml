  - record_key: ORDER-CALCULATION-0001
    kind: business-rule
    capability_key: order-creation
    requirement: >
      The system SHALL calculate order total price by summing the line item amounts,
      where each line item amount is the product of unit cost and quantity:
      GIVEN an order with n line items,
      WHEN each line item i contains unitCost and quantity,
      THEN totalPrice = SUM(unitCost[i] * quantity[i]) for all i.
    confidence: high
    confidence_basis: >
      The calculation is explicitly coded in OrderEJBAction with float arithmetic.
      The result is set on the purchase order before transmission.
    risk_class: financial
    basis: >
      OrderEJBAction iterates cart items and accumulates totalCost by multiplying
      item.getUnitCost() by item.getQuantity() and summing. Result is set via
      purchaseOrder.setTotalPrice(totalCost).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 133
        line_end: 146
        excerpt: |
          int lineItemCount = 0;
          float totalCost = 0;
          Collection items = cart.getItems();
          Iterator it = items.iterator();
          while (it.hasNext()) {
            CartItem item = (CartItem)it.next();
            float cost = new Float(item.getUnitCost()).floatValue();
            totalCost += (cost*item.getQuantity());
            purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                   item.getProductId(),
                                                   item.getItemId(),
                                                   (lineItemCount++) + "",
                                                   item.getQuantity(),
                                                   cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

  - record_key: ORDER-WORKFLOW-0001
    kind: workflow
    capability_key: order-creation
    requirement: >
      The system SHALL support the following order creation workflow:
      GIVEN a user with a non-empty shopping cart has selected payment and shipping info,
      WHEN the user submits an order,
      THEN the system SHALL (1) generate a unique order ID, (2) capture billing and shipping
      addresses and credit card information, (3) convert all cart items to line items with
      current unit costs, (4) calculate the order total price, (5) clear the shopping cart,
      and (6) send the order asynchronously.
    confidence: high
    confidence_basis: >
      OrderEJBAction implements the complete workflow: UniqueIdGenerator creates order ID,
      ContactInfo and CreditCard are captured from OrderEvent, cart.getItems() converts
      items, totalCost calculation, cart.empty() clears cart, AsyncSender transmits order.
    risk_class: financial
    basis: >
      OrderEJBAction.perform() sequence: creates PurchaseOrder, gets UID from UniqueIdGenerator,
      retrieves ShoppingClientFacade and user ID, sets order properties from event (billTo,
      shipTo, creditCard), converts cart items to line items, calculates total, clears cart
      with cart.empty(), and sends XML via AsyncSender.sendAMessage().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 90
        line_end: 169
        excerpt: |
          PurchaseOrder purchaseOrder = new PurchaseOrder();
          // ... bill/ship/card extraction ...
          UniqueIdGeneratorLocal uidgen = home.create();
          orderIdString = uidgen.getUniqueId("1001");
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          // ... populate order fields ...
          Collection items = cart.getItems();
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
          // ... convert items to line items ...
          purchaseOrder.setTotalPrice(totalCost);
          AsyncSender sender= home.create();
          sender.sendAMessage(purchaseOrder.toXML());
          cart.empty();
          return new OrderEventResponse(billTo.getEmail(), orderIdString);

