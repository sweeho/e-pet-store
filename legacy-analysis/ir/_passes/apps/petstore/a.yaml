  - record_key: CART-WORKFLOW-0001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      The system SHALL support the following cart operations in sequence:
      GIVEN a user is shopping,
      WHEN the user selects an item,
      THEN the system SHALL add the item to the shopping cart with default quantity of 1;
      WHEN the user modifies cart quantities,
      THEN the system SHALL update the quantity for each item;
      WHEN the user removes an item,
      THEN the system SHALL delete the item from the cart;
      WHEN the user views the cart,
      THEN the system SHALL display all items with product details, unit cost, quantity,
      and calculated line total (unitCost * quantity).
    confidence: high
    confidence_basis: >
      The CartEJBAction code explicitly implements ADD_ITEM, DELETE_ITEM, and UPDATE_ITEMS
      cases. Cart retrieval and display are referenced across multiple JSP files.
    risk_class: operational
    basis: >
      CartEJBAction.perform() method dispatches on CartEvent.getActionType() with explicit
      handling for ADD_ITEM (adds item), DELETE_ITEM (deletes item), and UPDATE_ITEMS
      (updates quantities via updateItemQuantity calls). OrderEJBAction.perform() calls
      cart.getItems() and iterates CartItem objects containing unitCost and quantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 66
        line_end: 89
        excerpt: |
          switch (ce.getActionType()) {
              case  CartEvent.ADD_ITEM  : {
                  cart.addItem(ce.getItemId());
              }
              break;
              case  CartEvent.DELETE_ITEM : {
                  cart.deleteItem(ce.getItemId());
              }
              break;
              case  CartEvent.UPDATE_ITEMS : {
                  Map items = ce.getItems();
                  Iterator it = null;
                  if (items != null) it = items.keySet().iterator();
                  while ((it != null) && it.hasNext()) {
                      String itemId = (String)it.next();
                      int quantity = ((Integer)items.get(itemId)).intValue();
                      cart.updateItemQuantity(itemId, quantity);
                  }
              }

