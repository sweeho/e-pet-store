                                                   (lineItemCount++) + "",
                                                   item.getQuantity(),
                                                   cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

  - record_key: ORDER-WORKFLOW-0001
    kind: workflow
    capability_key: order-creation
    requirement: >
      The system SHALL support the following order creation workflow:
      GIVEN a user with a non-empty shopping cart has selected payment and shipping info,
      WHEN the user submits an order,
      THEN the system SHALL (1) generate a unique order ID via UniqueIdGenerator with
      prefix "1001", (2) capture billing and shipping addresses and credit card information
      from the order event, (3) convert all cart items to line items with current unit costs,
      (4) calculate the order total price via sum(unitCost * quantity), (5) clear the shopping
      cart via cart.empty(), and (6) send the order asynchronously as XML via AsyncSender.
      The order is NOT persisted synchronously; async transmission occurs before response.
    confidence: high
    confidence_basis: >
      OrderEJBAction implements the complete workflow in sequence: UniqueIdGenerator
      creates order ID, ContactInfo/CreditCard extracted from event, cart items converted,
      totalCost calculated, cart.empty() called, AsyncSender.sendAMessage() invoked.
      Sequence is explicit and reachable from order.do mapping.
    risk_class: financial
    basis: >
      OrderEJBAction.perform() performs all six steps in order: (1) uidgen.getUniqueId("1001"),
      (2) sets billTo/shipTo/creditCard from event, (3) iterates cart.getItems() and creates
      LineItem objects, (4) accumulates totalCost, (5) calls cart.empty(), (6) obtains
      AsyncSender and calls sender.sendAMessage(purchaseOrder.toXML()).
    stack_metadata:
      ejb.bean: OrderEJBAction
      ejb.transaction: Required
