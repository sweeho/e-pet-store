  - record_key: CATALOG-ENTITY-0001
    kind: entity
    capability_key: catalog-search
    requirement: >
      The system SHALL maintain a hierarchical catalog structure:
      Category entities (catid), each with localized details (category_details: name, image, description, locale).
      Product entities (productid) belonging to categories, each with localized details (product_details: name, image, description, locale).
      Item entities (itemid) belonging to products, each with localized details (item_details: listprice, unitcost, image, description, attributes 1-5, locale).
      All locale-aware lookups use locale as part of composite primary key.
    confidence: high
    confidence_basis: >
      Database schema in PopulateSQL.xml explicitly defines all six tables with
      constraints. Primary key definitions show locale as composite key component.
      Foreign key constraints establish the hierarchy. All decimal prices are
      decimal(10,2) precision. This is DDL truth.
    risk_class: operational
    basis: >
      PopulateSQL.xml database statements for both Cloudscape and Oracle define
      table structures. category has catid PK. category_details has (catid, locale) PK.
      product has productid PK with catid FK. product_details has (productid, locale) PK.
      item has itemid PK with productid FK. item_details has (itemid, locale) PK with
      listprice and unitcost as decimal(10,2).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 45
        line_end: 120
        excerpt: |
          <CreateStatement>
            create table category (catid varchar(10) not null,
              constraint pk_category primary key (catid))
          </CreateStatement>
          <CreateStatement>
            create table category_details (catid varchar(10) not null,
              name varchar(80) not null, image varchar(255) null,
              descn varchar(255) null, locale varchar(10) not null,
              constraint pk_category_details primary key (catid, locale),
              constraint fk_category_details_1 foreign key (catid)
              references category (catid))
          </CreateStatement>
          <CreateStatement>
            create table product (productid varchar(10) not null,
              catid varchar(10) not null,
              constraint pk_product primary key (productid),
              constraint fk_product_1 foreign key (catid)
              references category (catid))
          </CreateStatement>
          <CreateStatement>
            create table product_details (productid varchar(10) not null,
              locale varchar(10) not null, name varchar(80) not null,
              image varchar(255) null, descn varchar(255) null,
              constraint pk_product_details primary key (productid, locale),
              constraint fk_product_details_1 foreign key (productid)
              references product (productid))
          </CreateStatement>
          <CreateStatement>
            create table item (itemid varchar(10) not null,
              productid varchar(10) not null,
              constraint pk_item primary key (itemid),
              constraint fk_item_1 foreign key (productid)
              references product (productid))
          </CreateStatement>
          <CreateStatement>
            create table item_details (itemid varchar(10) not null,
              listprice decimal(10,2) not null, unitcost decimal(10,2) not null,
              locale varchar(10) not null, image varchar(255) not null,
              descn varchar(255) not null, attr1 varchar(80) null,
              attr2 varchar(80) null, attr3 varchar(80) null,
              attr4 varchar(80) null, attr5 varchar(80) null,
              constraint pk_item_details primary key (itemid, locale),
              constraint fk_item_details_1 foreign key (itemid)
              references item (itemid))
          </CreateStatement>

