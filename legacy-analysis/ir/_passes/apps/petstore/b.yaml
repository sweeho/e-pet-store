  - record_key: PAY-PARSE-0001
    kind: business-rule
    capability_key: payment-processing
    requirement: >
      The system SHALL parse credit card expiry date from MM/YYYY string format.
      GIVEN an expiryDate string "MM/YYYY",
      WHEN getExpiryMonth() is called, THEN return the substring before the "/" character;
      WHEN getExpiryYear() is called, THEN return the substring after the "/" character;
      IF the "/" character is not found or the date string is null,
      THEN return default month "01" and default year "2010".
    confidence: medium
    confidence_basis: >
      The parsing implementation is in CreditCardEJB with indexOf() and substring
      calls. Default values (01 and 2010) are hardcoded literals with no
      configuration or documentation. Parse logic is confirmed but default
      constants lack justification.
    risk_class: financial
    basis: >
      CreditCardEJB implements getExpiryMonth() and getExpiryYear(). Each method
      calls indexOf("/") on the dateString, then substring with hardcoded defaults
      if "/" is not found or string is null.
    stack_metadata:
      ejb.bean: CreditCardEJB
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }
          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }

