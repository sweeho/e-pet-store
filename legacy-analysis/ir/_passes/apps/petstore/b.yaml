  - record_key: CART-WORKFLOW-0001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      The system SHALL support the following cart operations:
      GIVEN a user is shopping,
      WHEN the user selects an item,
      THEN the system SHALL add the item to the shopping cart;
      WHEN the user modifies cart quantities via a map of itemId to quantity,
      THEN the system SHALL update the quantity for each specified item;
      WHEN the user removes an item,
      THEN the system SHALL delete the item from the cart;
      WHEN the user retrieves the cart,
      THEN the system SHALL return all items with their current state.
    confidence: high
    confidence_basis: >
      CartEJBAction.perform() implements a switch statement with explicit cases for
      CartEvent.ADD_ITEM, CartEvent.DELETE_ITEM, and CartEvent.UPDATE_ITEMS. The
      UPDATE_ITEMS case iterates a Map of itemId to Integer quantity. Direct method
      calls are traced in the code.
    risk_class: operational
    basis: >
      CartEJBAction retrieves ShoppingCartLocal via facade. Switch on
      ce.getActionType() with cases ADD_ITEM calling cart.addItem(), DELETE_ITEM
      calling cart.deleteItem(), and UPDATE_ITEMS iterating itemId-quantity map
      and calling cart.updateItemQuantity().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 59
        line_end: 92
        excerpt: |
          CartEvent ce = (CartEvent)e;
          ShoppingClientFacadeLocal scf = null;
          scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
          ShoppingCartLocal cart = scf.getShoppingCart();
          switch (ce.getActionType()) {
              case  CartEvent.ADD_ITEM  : {
                  cart.addItem(ce.getItemId());
              }
              break;
              case  CartEvent.DELETE_ITEM : {
                  cart.deleteItem(ce.getItemId());
              }
              break;
              case  CartEvent.UPDATE_ITEMS : {
                  Map items = ce.getItems();
                  Iterator it = null;
                  if (items != null) it = items.keySet().iterator();
                  while ((it != null) && it.hasNext()) {
                      String itemId = (String)it.next();
                      int quantity = ((Integer)items.get(itemId)).intValue();
                      cart.updateItemQuantity(itemId, quantity);
                  }
              }

  - record_key: CART-VALIDATION-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL NOT permit order creation from an empty shopping cart.
      WHEN order processing is attempted,
      IF the cart contains zero items,
      THEN the system SHALL throw ShoppingCartEmptyOrderException.
    confidence: high
    confidence_basis: >
      OrderEJBAction contains explicit check: items.size() == 0 throws
      ShoppingCartEmptyOrderException. Exception is mapped in mappings.xml to
      cart_empty_order_error.screen error page. Three sources confirm enforcement.
    risk_class: operational
    basis: >
      OrderEJBAction.perform() calls cart.getItems(), checks if items.size() == 0,
      and throws ShoppingCartEmptyOrderException("Shopping cart is empty").
      Exception mapping in mappings.xml directs to error screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          // if the cart is empty throw an exception saying so
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
