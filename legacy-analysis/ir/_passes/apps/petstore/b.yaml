  - record_key: ORDER-CALCULATION-0001
    kind: business-rule
    capability_key: order-creation
    requirement: >
      The system SHALL calculate order total price by summing line item amounts,
      where each line item amount equals unit cost multiplied by quantity:
      GIVEN an order with n line items,
      WHEN each line item contains unitCost and quantity,
      THEN totalPrice = SUM(unitCost[i] * quantity[i]) for all line items i.
      The calculation SHALL use float arithmetic (32-bit IEEE).
    confidence: high
    confidence_basis: >
      OrderEJBAction implements this calculation explicitly with float variables
      and += accumulation. The result is set on PurchaseOrder before async transmission.
      No alternative calculation path exists.
    risk_class: financial
    basis: >
      OrderEJBAction declares "float totalCost = 0" and iterates cart items,
      converting unitCost to float and accumulating:
      "float cost = new Float(item.getUnitCost()).floatValue();
       totalCost += (cost*item.getQuantity());"
      Then calls "purchaseOrder.setTotalPrice(totalCost)".
