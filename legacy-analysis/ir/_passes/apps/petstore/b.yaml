  - record_key: BANNER-CATEGORY-0001
    kind: business-rule
    capability_key: catalog-search
    requirement: >
      The system SHALL display category-specific banner images based on the category ID.
      GIVEN a product category (DOGS, CATS, REPTILES, BIRDS, or FISH),
      WHEN a page displays content for that category,
      THEN the system SHALL select the corresponding banner image:
      - DOGS → banner_dogs.gif
      - CATS → banner_cats.gif
      - REPTILES → banner_reptiles.gif
      - BIRDS → banner_birds.gif
      - FISH → banner_fish.gif
      - (default/unknown) → banner_dogs.gif
      The category ID comparison is case-insensitive (converted to lowercase).
    confidence: medium
    confidence_basis: >
      BannerHelper.getBanner() implements the exact mapping with hardcoded if/else
      chain. The setCategoryId() method calls toLowerCase() for case-insensitive
      comparison. However, no code in examined source instantiates BannerHelper or
      calls getBanner(), so usage context is not confirmed.
    risk_class: presentational
    basis: >
      BannerHelper class has setCategoryId(String categoryId) which calls
      categoryId.toLowerCase(). getBanner() method compares the lowercase ID against
      the five category strings and returns corresponding banner filename. Default
      is "banner_dogs.gif" if no match.
    stack_metadata:
      framework: WAF
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/BannerHelper.java
        line_start: 48
        line_end: 77
        excerpt: |
          public class BannerHelper implements java.io.Serializable {
              private String categoryId = "";
              public void setCategoryId(String categoryId) {
                  this.categoryId = categoryId.toLowerCase();
              }
              public String getBanner() {
                  if (categoryId.equals("dogs")) {
                      return "banner_dogs.gif";
                  } else if (categoryId.equals("cats")) {
                      return "banner_cats.gif";
                  } else if (categoryId.equals("reptiles")) {
                      return "banner_reptiles.gif";
                  } else if (categoryId.equals("birds")) {
                      return "banner_birds.gif";
                  } else if (categoryId.equals("fish")) {
                      return "banner_fish.gif";
                  }
                  return "banner_dogs.gif";
              }

