  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
    description: >
      XML validation configuration values are redacted (secret-finding-55, 56, 57, 58)
      making it impossible to determine whether XML validation and XSD validation
      are actually enabled or disabled. A human must verify the actual configuration
      values to determine validation behavior.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      The XML transformation between TPASupplierOrder XML format and SupplierOrder
      entity format is handled by TPASupplierOrderXDE class which is not present
      in the supplied source. The exact data mapping and transformation rules cannot
      be verified from the available code alone. The XSL stylesheet shows some field
      reordering (FirstName->FamilyName, LastName->GivenName) which may or may not
      be intentional.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/displayinventory.jsp
    description: >
      The JSP form includes checkboxes with name "item_<itemId>" but the form
      processing in RcvrRequestProcessor.updateInventory() only processes items
      where a parameter starting with "item_" exists. However, the logic does not
      validate that the checkbox was actually checked - it only verifies the parameter
      exists. This means even unchecked checkboxes might be processed depending on
      browser form submission behavior. The intended behavior (only update checked
      items) is ambiguous.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/rsrc/xsl/TPASupplierOrder.xsl
    description: >
      The XSL template at lines 26-27 maps tpaso:FirstName to FamilyName and
      tpaso:LastName to GivenName, which appears to be a field reversal. This may be
      intentional data transformation or a bug. The context does not clarify whether
      this is the correct mapping.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: >
      The updateInventory method silently ignores empty quantity values (line 124-125)
      with "continue" but does not provide user feedback. The user will not know which
      items were skipped due to empty input. Error handling and user feedback behavior
      is undefined.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      OrderStatusNames.COMPLETED and OrderStatusNames.PENDING are external constants
      from a component not included in the source. The actual string values these
      resolve to cannot be determined, making it impossible to verify order status
      values against documentation or other systems.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/displayinventory.jsp
    description: >
      The displayinventory.jsp creates a session-scoped bean (DisplayInventoryBean)
      with scope="session", but inventory can be updated by multiple suppliers or in
      parallel. Session scope means each user gets their own inventory view which may
      not reflect concurrent updates from other users. Session caching behavior and
      invalidation strategy is not defined.
