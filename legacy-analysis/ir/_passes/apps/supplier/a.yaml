records:
  - record_key: ORD-REQU-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL persist a purchase order from XML into persistent storage
      when the supplier receives a purchase order message.
    confidence: high
    confidence_basis: >
      Observed in OrderFulfillmentFacadeEJB.processPO() which creates a
      SupplierOrderLocal entity from XML input. Both passes can verify at
      the entity level and in code paths that call processPO.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.processPO() creates a SupplierOrderLocal by calling
      supplierOrderLocalHome.create(supplierOrder) after deserializing the XML. The
      entity is then used in subsequent fulfillment logic, confirming persistence.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 236
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;

            // Convert Po in XML to PO as Java Obj
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
            //fullfil order
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required
      framework: J2EE EJB

  - record_key: ORD-REQU-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order with line items, WHEN the supplier checks inventory,
      THEN the system SHALL verify that available quantity is at least equal to
      the required quantity for each item.
    confidence: high
    confidence_basis: >
      The checkInventory method directly compares inv.getQuantity() < item.getQuantity()
      and returns false if insufficient. Both passes can verify from InventoryEJB CMP
      fields and code logic.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.checkInventory() method at line 129 checks
      "if(inv.getQuantity() < item.getQuantity()) return(false)" explicitly.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

  - record_key: ORD-REQU-0003
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      WHEN an inventory check succeeds for a line item, the system SHALL
      reduce the inventory quantity by the ordered amount.
    confidence: high
    confidence_basis: >
      Inventory reduction is explicitly coded in checkInventory at line 131
      calling inv.reduceQuantity(), and confirmed in InventoryEJB implementation
      which subtracts the amount from current quantity.
    risk_class: operational
    basis: >
      checkInventory() calls inv.reduceQuantity(item.getQuantity()) immediately
      after verifying sufficient quantity. InventoryEJB.reduceQuantity() at line 82-85
      implements "setQuantity(q-quantity)" to perform the reduction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          inv.reduceQuantity(item.getQuantity());
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 82
        line_end: 85
        excerpt: |
          public void reduceQuantity(int quantity) {
            int q = this.getQuantity();
            setQuantity(q-quantity);
          }
    stack_metadata:
      ejb.bean: InventoryEJB

