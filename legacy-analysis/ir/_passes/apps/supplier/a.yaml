  - record_key: ORD-REQU-0010
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide a processPendingPO operation that finds all orders
      with PENDING status and attempts to fulfill them using current inventory.
    confidence: high
    confidence_basis: >
      processPendingPO method explicitly calls supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING)
      and iterates through results calling processAnOrder.
    risk_class: operational
    basis: >
      processPendingPO at lines 247-269 queries for PENDING orders and processes each one.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 247
        line_end: 269
        excerpt: |
          public Collection processPendingPO() throws FinderException {
            ArrayList invoices = new ArrayList();

            Collection coll =
              supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
            if(coll != null) {
              Iterator it = coll.iterator();
              while((it!=null) && (it.hasNext())) {
                SupplierOrderLocal order = (SupplierOrderLocal) it.next();
                String newInvoice = null;
                try {
                  newInvoice = processAnOrder(order);
                } catch (XMLDocumentException xe) {
                  // ignore since means we cant fulfill this order now
                  System.out.println("OrderFulfillmentFacade:" + xe);
                }
                if(newInvoice != null) {
                  invoices.add(newInvoice);
                }
              }
            }
            return invoices;
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

