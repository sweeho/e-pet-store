  - record_key: TRANS-SEND-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The SupplierOrderTD transition delegate SHALL send fulfillment invoices
      to the InvoiceTopic via JMS upon completion of order processing.
    confidence: high
    confidence_basis: >
      SupplierOrderTD.doTransition() at lines 76-83 looks up TopicConnectionFactory
      and Topic, creates TopicSender, and sends XML invoice message.
    risk_class: operational
    basis: >
      SupplierOrderTD sends invoice via JMS TopicSender to InvoiceTopic.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/transitions/SupplierOrderTD.java
        line_start: 58
        line_end: 83
        excerpt: |
          public void setup() throws TransitionException {
            try {
              ServiceLocator servicelocator = new ServiceLocator();
              topicFactory = servicelocator.getTopicConnectionFactory(JNDINames.TOPIC_CONNECTION_FACTORY);
              topic = servicelocator.getTopic(JNDINames.INVOICE_MDB_TOPIC);
              invoiceTopicSender = new TopicSender(topicFactory, topic);
            } catch(ServiceLocatorException se) {
                throw new TransitionException(se);
            }
          }

          public void doTransition(TransitionInfo info) throws TransitionException {
            String xmlInvoice = info.getXMLMessage();
            try {
              invoiceTopicSender.sendMessage(xmlInvoice);
            } catch(JMSException je) {
                throw new TransitionException(je);
            }
          }
