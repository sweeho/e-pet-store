  - record_key: MDB-PROC-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The SupplierOrderMDB SHALL initialize OrderFulfillmentFacadeLocal and
      TransitionDelegate instances in ejbCreate() method for use in message
      processing.
    confidence: high
    confidence_basis: >
      SupplierOrderMDB.ejbCreate() at lines 75-92 performs JNDI lookups and
      creates instances stored in instance variables used by onMessage().
    risk_class: operational
    basis: >
      ejbCreate() initializes poProcessor and transitionDelegate beans
      which are used in message processing.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 75
        line_end: 92
        excerpt: |
          public void ejbCreate() {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              OrderFulfillmentFacadeLocalHome ref = (OrderFulfillmentFacadeLocalHome)
                                                serviceLocator.getLocalHome(JNDINames.ORDERFACADE_EJB);
              poProcessor = ref.create();
              String tdClassName = serviceLocator.getString(JNDINames.TRANSITION_DELEGATE__SUPPLIER_ORDER);
              TransitionDelegateFactory tdf = new TransitionDelegateFactory();
              transitionDelegate = tdf.getTransitionDelegate(tdClassName);
              transitionDelegate.setup();
            } catch (CreateException ce) {
                throw new EJBException(ce);
            } catch (TransitionException te) {
                throw new EJBException(te);
            } catch (ServiceLocatorException se) {
                throw new EJBException(se);
            }
          }
