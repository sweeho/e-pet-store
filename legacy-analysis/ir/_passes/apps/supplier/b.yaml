  - record_key: INV-OPER-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      WHEN inventory lookup by item ID fails (FinderException), the system
      SHALL NOT propagate the exception but instead handle it silently and
      allow inventory reduction operation to fail gracefully for that item.
    confidence: high
    confidence_basis: >
      checkInventory at lines 132-137 explicitly catches FinderException
      and returns false without rethrowing, allowing the order processing loop
      to continue with next item.
    risk_class: operational
    basis: >
      FinderException in checkInventory is caught and swallowed, returning false
      which signals inventory check failure without exception propagation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

  - record_key: INV-UPD-0001
    kind: requirement
    capability_key: supplier-portal
    requirement: >
      WHEN a user submits quantity updates with empty or missing quantity field,
      the system SHALL silently skip that item without processing or providing
      user feedback.
    confidence: medium
    confidence_basis: >
      updateInventory at lines 123-125 checks for null or empty newQty and
      calls continue without error feedback. User is not informed of skipped items.
    risk_class: operational
    basis: >
      updateInventory silently skips items with empty quantity using continue statement.
    traces:
