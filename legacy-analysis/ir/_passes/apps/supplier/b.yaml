  - record_key: ORD-REQU-0013
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL deserialize incoming purchase order XML documents into
      SupplierOrder entity objects using an XML document adapter (XDE).
    confidence: high
    confidence_basis: >
      The deserializat pattern is explicit in OrderFulfillmentFacadeEJB.processPO() at
      lines 229-231 where supplierOrderXDE.setDocument() and getSupplierOrder() are
      called sequentially. Both the TPASupplierOrderXDE class instantiation in ejbCreate
      and usage pattern are clear.
    risk_class: operational
    basis: >
      processPO method deserializes XML string into SupplierOrder object through
      TPASupplierOrderXDE adapter before entity persistence.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;

            // Convert Po in XML to PO as Java Obj
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
            //fullfil order
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      framework: J2EE EJB

  - record_key: ORD-REQU-0014
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      WHEN inventory check fails for any item in an order, the system SHALL
      set allItemsAvailable flag to false and continue processing remaining items
      without interrupting the overall order processing.
    confidence: high
    confidence_basis: >
      The flag initialization and update logic is explicit at line 178 and lines 189-191.
      The flag controls final order status decision but does not halt processing.
    risk_class: operational
    basis: >
      processAnOrder initializes allItemsAvailable=true and sets it to false when
      checkInventory returns false, but the loop continues to next item.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 198
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;

              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }//end while
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

